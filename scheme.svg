<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code на VPS: ноутбук, сервер и Anthropic</title>
  <desc id="desc">Ноутбук подключается к VPS по SSH. Claude Code на VPS отправляет запросы к api.anthropic.com по HTTPS. VPN ноутбука остаётся только на плече SSH.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e73"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #d2d2d7; stroke-width: 1; }
      .soft { fill: #f5f5f7; stroke: #d2d2d7; stroke-width: 1; }
      .ink { fill: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Inter, system-ui, sans-serif; font-weight: 600; }
      .muted { fill: #6e6e73; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Inter, system-ui, sans-serif; font-weight: 400; }
      .small { fill: #6e6e73; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Inter, system-ui, sans-serif; font-weight: 400; }
      .icon { fill: none; stroke: #1d1d1f; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .accent { fill: #0071e3; }
    </style>
  </defs>

  <rect width="1400" height="440" fill="#ffffff"/>

  <!-- Laptop -->
  <rect class="soft" x="40" y="70" width="360" height="210" rx="20"/>
  <rect class="icon" x="86" y="102" width="86" height="56" rx="6"/>
  <path class="icon" d="M 72 168 L 186 168"/>
  <path class="icon" d="M 86 182 L 172 182"/>
  <text class="ink" x="200" y="130" font-size="22">Ноутбук</text>
  <text class="muted" x="200" y="158" font-size="15">терминал или VS Code</text>
  <text class="small" x="86" y="214" font-size="14">VPN только на этом плече</text>

  <!-- VPS -->
  <rect class="card" x="500" y="70" width="360" height="210" rx="20" filter="url(#shadow)"/>
  <rect class="icon" x="546" y="102" width="56" height="16" rx="4"/>
  <rect class="icon" x="546" y="124" width="56" height="16" rx="4"/>
  <rect class="icon" x="546" y="146" width="56" height="16" rx="4"/>
  <circle class="accent" cx="560" cy="110" r="2.4"/>
  <circle class="accent" cx="560" cy="132" r="2.4"/>
  <circle class="accent" cx="560" cy="154" r="2.4"/>
  <text class="ink" x="620" y="130" font-size="22">VPS Ubuntu 24.04</text>
  <text class="muted" x="620" y="158" font-size="15">Claude Code + tmux</text>
  <text class="small" x="546" y="214" font-size="14">отдельный пользователь dev</text>

  <!-- Anthropic -->
  <rect class="soft" x="960" y="70" width="360" height="210" rx="20"/>
  <path class="icon" d="M 1012 150 C 996 150 988 138 996 126 C 1000 118 1010 116 1018 120 C 1024 106 1046 104 1054 116 C 1068 110 1084 120 1082 134 C 1092 138 1094 150 1082 156 L 1018 156 Z"/>
  <text class="ink" x="1096" y="130" font-size="22">api.anthropic.com</text>
  <text class="muted" x="1096" y="158" font-size="15">модель и инструменты</text>
  <text class="small" x="1006" y="214" font-size="14">видит IP VPS, не ноутбука</text>

  <!-- Arrows -->
  <line x1="400" y1="175" x2="492" y2="175" stroke="#6e6e73" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="446" y="158" font-size="14" text-anchor="middle">SSH 22</text>
  <text class="small" x="446" y="198" font-size="14" text-anchor="middle">ключ</text>

  <line x1="860" y1="175" x2="952" y2="175" stroke="#6e6e73" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="small" x="906" y="158" font-size="14" text-anchor="middle">HTTPS 443</text>
  <text class="small" x="906" y="198" font-size="14" text-anchor="middle">с IP VPS</text>

  <!-- Bottom note -->
  <rect x="40" y="330" width="1320" height="56" rx="14" fill="#f5f5f7"/>
  <circle cx="68" cy="358" r="5" fill="#0071e3"/>
  <text class="muted" x="84" y="364" font-size="16">Claude Code делает запросы к Anthropic с сервера. Ноутбук держит только SSH, поэтому VPN ноутбука не попадает в запросы модели.</text>
</svg>
